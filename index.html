<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torre y Simulador — Gasoil Pesado</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; padding:0; background:#0c0906; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 0px; }
  @keyframes flicker { 0%,100% { opacity:.55; transform:scaleY(1);} 50% { opacity:1; transform:scaleY(1.12);} }
  .flame { animation: flicker 1.4s ease-in-out infinite; transform-origin:bottom; }
  @keyframes rise { 0% { opacity:0; transform:translateY(8px);} 100% { opacity:1; transform:translateY(0);} }
  .rise { animation: rise .35s ease-out; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

/* ================= PALETA ================= */
const C = {
  bg:'#14100c', bgAlt:'#1a130d', line:'#3d2a1a', border:'#2a1f15',
  gold:'#c9973f', goldLight:'#e3b563', cream:'#f2e6d2', muted:'#b8a487', faint:'#7a6a55',
  brown:'#7a5230', brownDark:'#3d2a1a',
};

/* ================= DATOS ================= */
const FRACCIONES = [
  { key:'gases', name:'Gases', temp:'menos de 30°C', color:'#f2e2ad', textColor:'#3a2c12', uso:'GLP y combustible para la propia refinería.' },
  { key:'naftas', name:'Naftas', temp:'30° a 200°C', color:'#e2c179', textColor:'#3a2c12', uso:'Base de la gasolina para motores nafteros.' },
  { key:'queroseno', name:'Queroseno', temp:'150° a 250°C', color:'#cf9f4f', textColor:'#2a1c0c', uso:'Combustible de aviación (Jet A-1).' },
  { key:'gasoil', name:'Gasoil', temp:'250° a 320°C', color:'#a97a3c', textColor:'#f2e6d2', uso:'Diésel para transporte liviano.' },
  { key:'gasoilp', name:'Gasoil pesado', temp:'320° a 400°C', color:'#7a5230', textColor:'#f2e6d2', uso:'Motores diésel pesados, barcos y generadores.' },
  { key:'reducido', name:'Petróleo reducido', temp:'más de 400°C', color:'#3d2a1a', textColor:'#e3c98f', uso:'Asfalto, aceites lubricantes y residuos.' },
];

const BARREL_KEYS = [
  { key:'gasolina', label:'Gasolina', color:'#e2c179' },
  { key:'gasoil', label:'Gasoil', color:'#a97a3c' },
  { key:'queroseno', label:'Querosén', color:'#cf9f4f' },
  { key:'aceites', label:'Aceites lubricantes', color:'#6b4423' },
  { key:'pesados', label:'Asfalto y otros pesados', color:'#3d2a1a' },
];

function GoldLine() {
  return <div className="h-px w-full mb-5" style={{background:`linear-gradient(to right, ${C.gold}, transparent)`}} />;
}

/* ================= TORRE ================= */
function Torre() {
  const [selected, setSelected] = useState(null);
  const [showTemps, setShowTemps] = useState(true);
  const active = FRACCIONES.find(f => f.key === selected);
  return (
    <div className="px-5 pt-6 pb-8 rise">
      <div className="flex items-end justify-between mb-1">
        <h1 className="text-3xl italic font-serif" style={{color:C.gold}}>Torre</h1>
        <button onClick={() => setShowTemps(s => !s)} className="text-[11px] px-3 py-1.5 rounded-full border"
          style={{ borderColor:C.brown, color: showTemps ? '#141009' : C.gold, background: showTemps ? C.gold : 'transparent' }}>
          Temperaturas
        </button>
      </div>
      <GoldLine />
      <p className="text-sm mb-5" style={{color:C.muted}}>Tocá cada nivel de la torre para ver en qué se convierte esa fracción del petróleo.</p>
      <div className="flex gap-4">
        <div className="flex flex-col w-32 shrink-0 rounded-2xl overflow-hidden border" style={{borderColor:C.line}}>
          {FRACCIONES.map(f => (
            <button key={f.key} onClick={() => setSelected(f.key)} className="relative flex items-center justify-center text-center px-1"
              style={{ background:f.color, color:f.textColor, height:68, fontSize:11, fontWeight:600,
                outline: selected === f.key ? '2px solid #f2e2ad' : 'none', outlineOffset:-2,
                opacity: selected && selected !== f.key ? 0.55 : 1 }}>
              {f.name}
            </button>
          ))}
          <div className="relative flex items-center justify-center py-3" style={{background:'#1a120b'}}>
            <div className="flame w-3 h-6 rounded-full" style={{background:'radial-gradient(circle at 50% 100%, #ffcf6b, #d4600f 70%)'}} />
          </div>
        </div>
        <div className="flex-1 rounded-2xl p-4 border" style={{background:C.bgAlt, borderColor:C.line, minHeight:280}}>
          {!active && <div className="h-full flex items-center justify-center text-center text-sm" style={{color:C.faint}}>Elegí un nivel de la torre para ver sus detalles.</div>}
          {active && (
            <div className="rise">
              <div className="w-9 h-9 rounded-full mb-3" style={{background:active.color}} />
              <h2 className="text-lg font-semibold mb-1" style={{color:C.cream}}>{active.name}</h2>
              {showTemps && <p className="text-xs mb-3 px-2 py-1 inline-block rounded-md" style={{background:C.line, color:C.goldLight}}>{active.temp}</p>}
              <p className="text-sm leading-relaxed" style={{color:C.muted}}>{active.uso}</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ================= SIMULADOR: Barril ================= */
function Barril() {
  const [barrel, setBarrel] = useState({ gasolina:15, gasoil:10, queroseno:5, aceites:10, pesados:60 });
  const [cracked, setCracked] = useState(false);
  const handleChange = (key, rawVal) => {
    const val = Math.max(0, Math.min(100, rawVal));
    const others = BARREL_KEYS.map(b => b.key).filter(k => k !== key);
    const sumOthers = others.reduce((s,k) => s + barrel[k], 0);
    const diff = val - barrel[key];
    let next = { ...barrel, [key]: val };
    if (sumOthers > 0) {
      const target = sumOthers - diff;
      const factor = Math.max(0, target) / sumOthers;
      let running = 0;
      others.forEach((k, i) => {
        if (i === others.length - 1) next[k] = Math.max(0, 100 - val - running);
        else { const v = Math.round(barrel[k] * factor); next[k] = v; running += v; }
      });
    }
    setBarrel(next); setCracked(false);
  };
  const applyCracking = () => {
    setBarrel(prev => {
      const moved = Math.min(40, prev.pesados - 15);
      return { gasolina: prev.gasolina + Math.round(moved*0.4), gasoil: prev.gasoil + Math.round(moved*0.35),
        queroseno: prev.queroseno + Math.round(moved*0.25), aceites: prev.aceites, pesados: prev.pesados - moved };
    });
    setCracked(true);
  };
  const heavy = barrel.pesados >= 50;
  return (
    <div className="rise">
      <div className="w-full h-6 rounded-full overflow-hidden flex mb-6 border" style={{borderColor:C.line}}>
        {BARREL_KEYS.map(b => <div key={b.key} style={{ width:`${barrel[b.key]}%`, background:b.color, transition:'width .35s ease' }} />)}
      </div>
      <div className="space-y-4 mb-6">
        {BARREL_KEYS.map(b => (
          <div key={b.key}>
            <div className="flex justify-between text-xs mb-1">
              <span style={{color:C.muted}}>{b.label}</span><span style={{color:C.goldLight}}>{barrel[b.key]}%</span>
            </div>
            <input type="range" min="0" max="100" value={barrel[b.key]} onChange={e => handleChange(b.key, parseInt(e.target.value))}
              className="w-full" style={{ accentColor:b.color }} />
          </div>
        ))}
      </div>
      <div className="rounded-xl p-4 border" style={{ borderColor: heavy ? C.brown : C.line, background:C.bgAlt }}>
        <p className="text-sm font-medium mb-2" style={{ color: heavy ? C.goldLight : '#9fd4a3' }}>
          {heavy ? '⚠️ Tu petróleo tiene una gran proporción de componentes pesados.' : '✔️ Buena proporción de livianos, ideal para transporte.'}
        </p>
        {heavy && !cracked && (
          <button onClick={applyCracking} className="w-full mt-1 py-2.5 rounded-lg text-sm font-semibold" style={{ background:C.gold, color:'#141009' }}>
            APLICAR CRACKING →
          </button>
        )}
        {cracked && <p className="text-xs leading-relaxed mt-1" style={{color:C.muted}}>El cracking rompió cadenas largas en moléculas más cortas, aumentando gasolina, gasoil y querosén.</p>}
      </div>
    </div>
  );
}

/* ================= SIMULADOR: Cracking antes/después ================= */
function Cracking() {
  const [intensity, setIntensity] = useState(20);
  const fragments = 1 + Math.floor(intensity / 20);
  const totalLinks = 12;
  const groups = useMemo(() => {
    const base = Math.floor(totalLinks / fragments); const rem = totalLinks % fragments;
    return Array.from({ length: fragments }, (_, i) => base + (i < rem ? 1 : 0));
  }, [fragments]);
  const message = fragments <= 1 ? 'Sin fragmentar: predomina una cadena larga, típica de gasoil pesado y residuos.'
    : fragments <= 2 ? 'Cracking leve: se obtienen principalmente gasoil y querosén.'
    : fragments <= 4 ? 'Cracking moderado: aparecen más naftas junto al gasoil.'
    : 'Cracking intenso: predominan gases y naftas livianas.';
  return (
    <div className="rise">
      <p className="text-xs uppercase tracking-wide mb-4" style={{color:C.faint}}>Antes → Después</p>
      <div className="rounded-xl p-4 mb-5 border" style={{background:C.bgAlt, borderColor:C.line}}>
        <p className="text-[11px] mb-2" style={{color:C.faint}}>ANTES</p>
        <div className="flex gap-1 mb-4">{Array.from({length: totalLinks}).map((_,i) => <div key={i} className="h-3 flex-1 rounded-sm" style={{background:'#4a2f1c'}} />)}</div>
        <div className="flex items-center justify-center text-2xl mb-4">🔥</div>
        <p className="text-[11px] mb-2" style={{color:C.faint}}>DESPUÉS</p>
        <div className="flex gap-2">
          {groups.map((len, gi) => (
            <div key={gi} className="flex gap-1 flex-1">
              {Array.from({length: len}).map((_,i) => <div key={i} className="h-3 flex-1 rounded-sm" style={{ background: gi % 2 === 0 ? '#e2c179' : '#cf9f4f' }} />)}
            </div>
          ))}
        </div>
      </div>
      <div className="mb-2 flex justify-between text-xs"><span style={{color:C.muted}}>Intensidad del cracking</span><span style={{color:C.goldLight}}>{intensity}%</span></div>
      <input type="range" min="0" max="100" value={intensity} onChange={e => setIntensity(parseInt(e.target.value))} className="w-full mb-5" style={{ accentColor:C.gold }} />
      <p className="text-sm leading-relaxed rounded-xl p-3 border" style={{ borderColor:C.line, color:C.muted, background:C.bgAlt }}>{message}</p>
    </div>
  );
}

function Simulador() {
  const [tab, setTab] = useState('barril');
  return (
    <div className="px-5 pt-6 pb-8">
      <h1 className="text-3xl italic font-serif mb-1" style={{color:C.gold}}>Simulador</h1>
      <GoldLine />
      <div className="flex gap-2 mb-6">
        {[['barril','Tu barril'],['cracking','Cracking']].map(([k,label]) => (
          <button key={k} onClick={() => setTab(k)} className="flex-1 py-2 rounded-full text-xs font-semibold"
            style={{ background: tab === k ? C.gold : 'transparent', color: tab === k ? '#141009' : C.gold, border:`1px solid ${C.brown}` }}>
            {label}
          </button>
        ))}
      </div>
      {tab === 'barril' ? <Barril /> : <Cracking />}
    </div>
  );
}

/* ================= APP (solo Torre + Simulador) ================= */
function App() {
  const [section, setSection] = useState('torre');
  return (
    <div className="min-h-screen w-full flex items-center justify-center py-8" style={{background:C.bg}}>
      <div className="w-full max-w-[420px] rounded-[2rem] overflow-hidden border shadow-2xl flex flex-col"
        style={{ borderColor:C.border, background:C.bg, height:'820px' }}>
        <div className="flex-1 overflow-y-auto">
          {section === 'torre' ? <Torre /> : <Simulador />}
        </div>
        <div className="flex border-t shrink-0" style={{borderColor:C.border, background:C.bgAlt}}>
          {[['torre','Torre'],['simulador','Simulador']].map(([k,label]) => (
            <button key={k} onClick={() => setSection(k)} className="flex-1 py-4 flex flex-col items-center gap-1">
              <div className="w-5 h-5 rounded-sm" style={{ background: section === k ? C.gold : '#5a4a38' }} />
              <span className="text-[11px] font-medium" style={{ color: section === k ? C.goldLight : C.faint }}>{label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
